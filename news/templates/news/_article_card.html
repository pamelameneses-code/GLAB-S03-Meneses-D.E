<article class="article-card">
    <p class="category-label"><a href="{% url 'news:category_articles' article.category.slug %}">{{ article.category.name }}</a></p>
    <h2><a href="{% url 'news:article_detail' article.slug %}">{{ article.title }}</a></h2>
    <p class="metadata">
        {{ article.author.name }} · <time datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|date:"d M Y" }}</time>
    </p>
    <p>{{ article.summary|truncatewords:20 }}</p>
    <a class="read-more" href="{% url 'news:article_detail' article.slug %}" aria-label="Leer más sobre {{ article.title }}">Leer más <span aria-hidden="true">→</span></a>
</article>
